server {
    server_name sputterbets.com www.sputterbets.com nfl.divinedavis.com;
    # Hardening 2026-09-05 (security audit): HSTS, referrer, permissions.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # CSP in Report-Only (2026-09-26 audit): the pages are one inline script each
    # plus Supabase; flip to enforcing once the console shows no violations.
    # No location below sets add_header, so every response inherits this set.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://chhmerckwgytnjhgdiym.supabase.co wss://chhmerckwgytnjhgdiym.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    root /var/www/nfl;
    index index.html;
    add_header Cache-Control "no-cache";

    # Shared picks cards. The sputter-og service returns the same app with the
    # Open Graph block rewritten to say whose picks these are — iMessage and
    # friends read the tags and never run the page's JavaScript. If the
    # service is down the static page still loads; only the preview is generic.
    location ^~ /s/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @share_fallback;
    }
    location @share_fallback {
        root /var/www/nfl;
        try_files /index.html =404;
    }

    # The college page lives in its own directory. Without the slash nginx
    # would test /college as a file, miss, and serve the NFL page instead.
    location = /college {
        return 301 /college/;
    }

    location / {
        # $uri/ so a directory (the college page) serves its own index.html
        # instead of falling through to the NFL page.
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sputterbets.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sputterbets.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sputterbets.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sputterbets.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sputterbets.com www.sputterbets.com nfl.divinedavis.com;
    return 404; # managed by Certbot




}